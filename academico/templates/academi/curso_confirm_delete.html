{% extends 'baseMaestros.html' %} 
{% load static %} 

{% block extra_css %}
<link rel="stylesheet" type="text/css" href="{% static 'academico/css/curso_confirm_delete.css' %}" />
{% endblock %} 

{% block content %}
<div class="overlay-modal">
  <div class="modal-curso">
    <div class="modal-cabecera">
      <h2>Eliminar Materia</h2>
      <a href="{% url 'curso_list' %}" class="btn-cerrar-modal" title="Cerrar">&times;</a>
    </div>

    <div class="modal-cuerpo">
      <div class="icono-advertencia">
        <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
        </svg>
      </div>
      
      <p class="texto-advertencia">¿Estás seguro de que quieres eliminar este curso? Esta acción no se puede deshacer.</p>
      
      <form method="post">
        {% csrf_token %}
        <div class="modal-acciones">
          <a href="{% url 'curso_list' %}" class="btn-secundario">Cancelar</a>
          <button type="submit" class="btn-peligro">Eliminar</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
