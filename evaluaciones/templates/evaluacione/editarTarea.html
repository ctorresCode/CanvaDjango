{% extends 'baseMaestros.html' %} {% load static %} {% block extra_css %}
<link
  rel="stylesheet"
  type="type/css"
  href="{% static 'evaluacione/css/editarTareas.css' %}"
/>
{% endblock %} {% block content %}
<!-- El overlay se mantiene activo por defecto para simular el modal -->
<div class="modal-overlay activo">
  <div class="modal-contenido">
    <div class="modal-cabecera">
      <h2>Editar Tarea</h2>
      <a href="{% url 'lista_de_tareas' %}" class="btn-cerrar">&times;</a>
    </div>

    <form method="POST" enctype="multipart/form-data" class="formulario-tarea">
      {% csrf_token %} {{ form.as_p }}

      <div class="modal-acciones">
        <a href="{% url 'lista_de_tareas' %}" class="btn-secundario"
          >Cancelar</a
        >
        <button type="submit" class="btn-primario">Guardar cambios</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
