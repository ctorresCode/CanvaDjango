{% load static %} {% block extra_css %}
<link rel="stylesheet" href="{% static 'usuario/css/register.css' %}" />
{% endblock %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrarse</title>
  </head>
  <body>
    <!-- Contenedor principal -->
    <div class="register-wrapper">
      <div class="register-card">
        <!-- Icono representativo (Libro abierto) -->
        <div class="school-icon">
          <svg
            width="42"
            height="42"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"
            ></path>
          </svg>
        </div>

        <div class="register-header">
          <h1>Comienza tu aprendizaje</h1>
          <p>Únete a nuestra comunidad creando tu cuenta hoy mismo.</p>
        </div>

        <form method="post" class="django-form">
          {% csrf_token %}

          <!-- Los campos generados por Django -->
          {{ form.as_p }}

          <button type="submit" class="btn-primary">Registrarse ahora</button>
        </form>

        <div class="register-footer">
          <p>
            ¿Ya tienes una cuenta?
            <a href="{% url 'login' %}">Inicia sesión aquí</a>
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
