{% load static %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión - BeboAcademy</title>

    {% block extra_css %}
    <link rel="stylesheet" href="{% static 'usuario/css/login.css' %}" />
    {% endblock %}
  </head>
  <body>
    <!-- Contenedor para centrar todo en la pantalla -->
    <div class="login-wrapper">
      <div class="login-card">
        <!-- Logo o Icono escolar opcional -->
        <div class="school-icon">
          <svg
            width="40"
            height="40"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 14l9-5-9-5-9 5 9 5z"
            ></path>
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"
            ></path>
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 14v7"
            ></path>
          </svg>
        </div>

        <div class="login-header">
          <h1>Bienvenido de vuelta</h1>
          <p>Ingresa tus credenciales para acceder al portal</p>
        </div>

        <form method="post" class="django-form">
          {% csrf_token %}

          <!-- Django inyectará los <p>, <label> e <input> aquí -->
          {{ form.as_p }}

          <button type="submit" class="btn-login">Iniciar Sesión</button>
        </form>
      </div>
    </div>
  </body>
</html>
